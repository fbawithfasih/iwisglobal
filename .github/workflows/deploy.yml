name: Deploy to Cloudflare Pages

# The iwisglobal Cloudflare Pages project was created via `wrangler pages
# deploy` (a "Direct Upload" project), and Cloudflare does not allow
# attaching a GitHub source to a project after the fact — confirmed via the
# Pages API (error 8000069, "You cannot update the source object in a
# Direct Uploads project."). This workflow replicates what native Git
# integration would do (build + deploy on every push to main) without
# migrating the live project, its custom domain, or its D1/R2 bindings.
#
# It also runs every night (02:00 India time) from the same main branch. The
# sitemap is built at deploy time from the database (src/lib/sitemapLastmod.mjs),
# so without this a blog post published or edited in the admin would only reach
# the sitemap, and its lastmod date, at the next code change. The nightly run
# deploys exactly what is already on main; nothing else changes.
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 20 * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # astro.config.mjs's build-time sitemap query for D1-backed
      # tours/blog_posts reads CLOUDFLARE_API_TOKEN from a literal .env
      # file on disk (not process.env — see that file's readEnvVar comment
      # for why). Without this, the build still succeeds but silently
      # drops tour/blog URLs from the sitemap. D1_READ_TOKEN is a separate
      # D1-scoped token: the deploy token (CLOUDFLARE_API_TOKEN) is
      # Pages-only and gets a 403 (code 7403) from the D1 query API.
      - name: Write .env for build-time D1 sitemap query
        run: echo "CLOUDFLARE_API_TOKEN=${{ secrets.D1_READ_TOKEN }}" > .env

      - run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler pages deploy dist --project-name=iwisglobal --branch=main
